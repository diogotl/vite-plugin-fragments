name: Release

on:
  push:
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # Opens or updates the "chore: release" pull request. Merging it bumps the version.
      - uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs on every push, but only publishes a version that is not on npm yet.
      # changeset publish passes --no-git-checks, which npm rejects, so npm publish is used.
      - name: Publish to npm if the version is new
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "vite-plugin-fragments@$VERSION" version >/dev/null 2>&1; then
            echo "$VERSION is already on npm"
            exit 0
          fi
          npm publish --access public --provenance

      # Only tags and releases a version that is on npm and does not have a GitHub release yet.
      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! npm view "vite-plugin-fragments@$VERSION" version >/dev/null 2>&1; then
            echo "$VERSION is not on npm, nothing to release"
            exit 0
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
            exit 0
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
